spring.application.name=sync-service
server.port=${SYNC_PORT:8083}

# Swagger UI muestra el contrato YAML (contract-first) en vez de uno generado desde el codigo.
# No poner springdoc.api-docs.enabled=false: eso apaga tambien Swagger UI y da 404.
springdoc.swagger-ui.url=/openapi/sync-api.yaml
springdoc.swagger-ui.path=/swagger-ui.html

# GetJob (HU-57): los campos que todavia no aplican no vienen en la respuesta (en vez de null).
spring.jackson.default-property-inclusion=non_null

# --- Seguridad (HU-53) ---
# API key que deben enviar los clientes en la cabecera X-API-Key. Si esta vacia, el servicio rechaza
# toda solicitud a /api/* con 401. Definirla con la variable de entorno SYNC_API_KEY.
sync.api-key=${SYNC_API_KEY:}

# CAMBIO: propiedad nueva (retardo del Thread antes de replicar).
# --- Retardo de la replicacion ---
# Segundos que el Thread espera entre consultar lo que falta por replicar y escribirlo en DynamoDB.
# La API ya respondio 202: mientras tanto el job sigue EN_PROGRESO. Con 0 no espera.
sync.retardo-segundos=${SYNC_RETARDO_SEGUNDOS:30}

# --- Instancia MySQL de origen (HU-55) ---
# Solo lectura: usuario con permiso SELECT y conexiones marcadas como read-only.
# Desde tu maquina el puerto es ORIGEN_DB_HOST_PORT (3308); dentro de Docker, mysql-origen:3306.
spring.datasource.url=jdbc:mysql://${ORIGEN_DB_HOST:localhost}:${ORIGEN_DB_PORT:3308}/${ORIGEN_DB_NAME:oficina_agua}
spring.datasource.username=${ORIGEN_DB_USER:sync_ro}
spring.datasource.password=${ORIGEN_DB_PASSWORD:}
spring.datasource.hikari.read-only=true
spring.datasource.hikari.connection-timeout=5000

# --- Destino Amazon DynamoDB (HU-56) ---
# Con endpoint: DynamoDB Local. Vacio: DynamoDB de AWS con las credenciales del entorno.
sync.dynamodb.endpoint=${DYNAMODB_ENDPOINT:http://localhost:8000}
sync.dynamodb.tabla=${DYNAMODB_TABLE_RESUMEN:oficina_agua_resumen}
sync.dynamodb.region=${AWS_REGION:us-east-1}
sync.dynamodb.access-key=${AWS_ACCESS_KEY_ID:local}
sync.dynamodb.secret-key=${AWS_SECRET_ACCESS_KEY:local}
