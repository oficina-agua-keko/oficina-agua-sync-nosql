# docker-compose.yml — Feature 4: Replicación Asíncrona a NoSQL
#
# Servicios (se van sumando por HU):
#   - dynamodb      : Amazon DynamoDB Local, destino de la replicación (HU-52)
#   - dynamodb-init : crea la tabla de resumen al levantar y termina (HU-52)
#   - mysql-origen  : instancia MySQL de solo lectura, origen de los datos (HU-55)
#   - sync-service  : endpoints Generate y GetJob, GenerarJob y Thread (HU-53 a HU-57)
#
# Las variables se leen del archivo .env (ver .env.example). Si no existe, se usan los
# valores por defecto de cada ${VARIABLE:-valor}.

name: oficina-agua-sync-nosql

services:
  dynamodb:
    image: amazon/dynamodb-local:latest
    container_name: sync-dynamodb
    # -sharedDb: una sola base para todas las credenciales y regiones.
    # -dbPath: guarda los datos en disco para que sobrevivan a un reinicio (volumen dynamodb-data).
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/home/dynamodblocal/data"]
    # Solo para desarrollo local: el volumen nombrado se crea con dueño root y el usuario por
    # defecto de la imagen no podría escribir en él.
    user: root
    ports:
      - "${DYNAMODB_HOST_PORT:-8000}:8000"
    volumes:
      - dynamodb-data:/home/dynamodblocal/data
    restart: unless-stopped

  # Contenedor de un solo uso: espera a DynamoDB, crea la tabla si no existe y termina.
  dynamodb-init:
    image: amazon/aws-cli:latest
    container_name: sync-dynamodb-init
    depends_on:
      - dynamodb
    entrypoint: ["/bin/sh", "/init/crear-tabla.sh"]
    environment:
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      DYNAMODB_TABLE_RESUMEN: ${DYNAMODB_TABLE_RESUMEN:-oficina_agua_resumen}
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-local}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-local}
      AWS_PAGER: ""
    volumes:
      - ./dynamodb/crear-tabla.sh:/init/crear-tabla.sh:ro
    restart: "no"

  # HU-55: instancia MySQL de origen. Se carga con el esquema y los datos del monolito
  # (db/origen/01) y crea el usuario de solo lectura del sync-service (db/origen/03).
  # Los scripts solo corren la primera vez; para recargarlos: docker compose down -v
  mysql-origen:
    image: mysql:8.4
    container_name: sync-mysql-origen
    environment:
      MYSQL_ROOT_PASSWORD: ${ORIGEN_DB_ROOT_PASSWORD:-cambiar_esta_password_root}
      MYSQL_DATABASE: ${ORIGEN_DB_NAME:-oficina_agua}
      ORIGEN_DB_USER: ${ORIGEN_DB_USER:-sync_ro}
      ORIGEN_DB_PASSWORD: ${ORIGEN_DB_PASSWORD:-cambiar_esta_password}
    ports:
      - "${ORIGEN_DB_HOST_PORT:-3308}:3306"
    volumes:
      - ./db/origen:/docker-entrypoint-initdb.d:ro
      - mysql-origen-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${ORIGEN_DB_ROOT_PASSWORD:-cambiar_esta_password_root}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # El servicio de replicación (HU-51, HU-53 a HU-57). Se compila dentro de Docker, así que no
  # hace falta tener Java ni Maven instalados. Espera a que la tabla de DynamoDB exista y a que
  # MySQL responda; se conecta a ambos por la red interna del compose.
  sync-service:
    build: ./sync-service
    container_name: sync-service
    depends_on:
      dynamodb-init:
        condition: service_completed_successfully
      mysql-origen:
        condition: service_healthy
    environment:
      SYNC_PORT: 8083
      SYNC_API_KEY: ${SYNC_API_KEY:-}
      # CAMBIO: variable nueva (retardo de la replicación, en segundos).
      SYNC_RETARDO_SEGUNDOS: ${SYNC_RETARDO_SEGUNDOS:-30}
      ORIGEN_DB_HOST: mysql-origen
      ORIGEN_DB_PORT: 3306
      ORIGEN_DB_NAME: ${ORIGEN_DB_NAME:-oficina_agua}
      ORIGEN_DB_USER: ${ORIGEN_DB_USER:-sync_ro}
      ORIGEN_DB_PASSWORD: ${ORIGEN_DB_PASSWORD:-cambiar_esta_password}
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      DYNAMODB_TABLE_RESUMEN: ${DYNAMODB_TABLE_RESUMEN:-oficina_agua_resumen}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-local}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-local}
    ports:
      - "${SYNC_PORT:-8083}:8083"
    restart: unless-stopped

volumes:
  dynamodb-data:
  mysql-origen-data:
